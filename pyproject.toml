[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trace-viewer"
version = "0.1.0"
description = "Record tool-calling agent runs as JSONL and render them as a self-contained HTML timeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
agent-trace-viewer = "agent_trace_viewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
